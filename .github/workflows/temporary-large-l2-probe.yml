name: Temporary abicheck main CastXML start probe

on:
  pull_request:
    paths:
      - .github/workflows/temporary-large-l2-probe.yml

permissions:
  contents: read

concurrency:
  group: temporary-abicheck-castxml-start-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ABICHECK_MAIN_SHA: 488f823cd58459307d969d92b9c5567d590043fd
      ABICHECK_PROBE_SHA: 4caf8e83fb9f15f53fa546d6f34eaacc35fc7fb6
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v6

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            castxml clang cmake gcc g++ git libclang-dev libeigen3-dev libjemalloc2 \
            libtbb-dev llvm-dev ninja-build

      - name: Checkout exact abicheck main plus profiling-only script
        run: |
          git clone https://github.com/abicheck/abicheck.git /tmp/abicheck
          git -C /tmp/abicheck checkout "$ABICHECK_PROBE_SHA"
          git -C /tmp/abicheck fetch --no-tags origin main
          test "$(git -C /tmp/abicheck rev-parse origin/main)" = "$ABICHECK_MAIN_SHA"
          git -C /tmp/abicheck diff --exit-code "$ABICHECK_MAIN_SHA" -- abicheck pyproject.toml
          python -m py_compile /tmp/abicheck/scripts/profile_castxml_start_semantics.py

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install exact current-main source
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e /tmp/abicheck

      - name: Build current CastXML source against system LLVM
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/CastXML/CastXML.git /tmp/CastXML-src
          llvm_dir="$(llvm-config --cmakedir)"
          clang_config="$(find /usr/lib/llvm-* -path '*/lib/cmake/clang/ClangConfig.cmake' | sort -V | tail -1)"
          test -n "$clang_config"
          cmake -S /tmp/CastXML-src -B /tmp/CastXML-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR="$llvm_dir" \
            -DClang_DIR="$(dirname "$clang_config")"
          cmake --build /tmp/CastXML-build --target castxml -- -j2
          bin="$(find /tmp/CastXML-build -type f -name castxml -perm -111 | head -1)"
          test -n "$bin"
          "$bin" --version
          echo "CASTXML_NEW_BIN=$bin" >> "$GITHUB_ENV"

      - name: Run start-root semantic and allocator benchmark
        run: |
          mkdir -p results
          python /tmp/abicheck/scripts/profile_castxml_start_semantics.py \
            --out results/castxml-start-semantics.json \
            >results/probe.log 2>&1
          cat results/probe.log

      - name: Upload profiling artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: abicheck-main-488f823-castxml-start-semantics
          path: results/
          if-no-files-found: warn
          retention-days: 7
