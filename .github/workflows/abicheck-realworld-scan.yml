name: abicheck real-world Clang scans

on:
  pull_request:
    paths:
      - ".github/workflows/abicheck-realworld-scan.yml"
      - "ci/abicheck_realworld_scan.py.part-*"
      - "ci/aggregate_abicheck.py.gz.b64"
  workflow_dispatch:

permissions:
  contents: read

env:
  ABICHECK_BUILD_JOBS: "2"
  ABICHECK_ONEDAL_JOBS: "2"

jobs:
  scan:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: [onednn]
    steps:
      - name: Checkout orchestration branch
        uses: actions/checkout@v4

      - name: Expand, patch, and verify orchestration scripts
        shell: bash
        run: |
          set -euxo pipefail
          cat ci/abicheck_realworld_scan.py.part-* > ci/abicheck_realworld_scan.py
          echo "9c300cf1242754497389a6cc03f15ad2a66949b9946c4f347f19576ed76896c2  ci/abicheck_realworld_scan.py" | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          path = Path("ci/abicheck_realworld_scan.py")
          text = path.read_text()
          old = "\n".join([
              '        shutil.rmtree(tbb / "include", ignore_errors=True)',
              '        os.symlink(Path("/usr/include"), tbb / "include", target_is_directory=True)',
              '        for candidate in sorted(multiarch.glob("libtbb*.so*")):',
          ])
          new = "\n".join([
              '        # Do not symlink the entire /usr/include tree into an early -I path.',
              '        # Clang de-duplicates the equivalent later system directory; then',
              "        # libstdc++ <cstdlib>'s #include_next <stdlib.h> has nowhere to go.",
              '        # Expose only the TBB namespaces expected below TBBROOT/include.',
              '        shutil.rmtree(tbb / "include", ignore_errors=True)',
              '        (tbb / "include").mkdir(parents=True, exist_ok=True)',
              '        for name in ("oneapi", "tbb"):',
              '            system_header_dir = Path("/usr/include") / name',
              '            if system_header_dir.exists():',
              '                os.symlink(system_header_dir, tbb / "include" / name, target_is_directory=True)',
              '        for candidate in sorted(multiarch.glob("libtbb*.so*")):',
          ])
          if old not in text:
              raise SystemExit("oneDAL TBB include-shim patch target not found")
          text = text.replace(old, new)
          old_parse = '-std=gnu++17 -Wno-error -Wno-unknown-warning-option'
          new_parse = '-std=gnu++17 -frtti -fexceptions -Wno-error -Wno-unknown-warning-option'
          if text.count(old_parse) != 4:
              raise SystemExit("unexpected header-parse option count")
          text = text.replace(old_parse, new_parse)
          old_dedupe = "\n".join([
              '    seen: set[tuple[int, int]] = set()',
              '    out: list[Path] = []',
              '    for path in sorted(candidates, key=lambda p: (p.name, str(p))):',
              '        st = path.stat()',
              '        key = (st.st_dev, st.st_ino)',
              '        if key in seen:',
              '            continue',
              '        seen.add(key)',
              '        out.append(path)',
          ])
          new_dedupe = "\n".join([
              '    # Build and install trees often contain byte-identical copies. Scan each',
              '    # unique ABI image once while the build/install tree manifests preserve',
              '    # every path. This avoids repeating an expensive full-header AST parse.',
              '    seen_content: set[str] = set()',
              '    out: list[Path] = []',
              '    for path in sorted(candidates, key=lambda p: (p.name, str(p))):',
              '        digest = sha256_file(path)',
              '        if digest in seen_content:',
              '            continue',
              '        seen_content.add(digest)',
              '        out.append(path)',
          ])
          if old_dedupe not in text:
              raise SystemExit("library de-duplication patch target not found")
          path.write_text(text.replace(old_dedupe, new_dedupe))
          PY
          echo "57795a54118840bacecb13b7073c45e0e0ccc8b645d763450272de4861d814f6  ci/abicheck_realworld_scan.py" | sha256sum -c -
          base64 -d ci/aggregate_abicheck.py.gz.b64 | gzip -dc > ci/aggregate_abicheck.py
          python -m py_compile ci/abicheck_realworld_scan.py ci/aggregate_abicheck.py

      - name: Install Clang, build, ABI, and dependency tooling
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            clang lld cmake ninja-build bear binutils file jq zstd gzip \
            libtbb-dev libhwloc-dev libopenblas-dev libspdlog-dev pkg-config \
            patchelf python3-dev python3-pip
          if ! sudo apt-get install -y castxml; then
            python -m pip install --upgrade castxml
          fi
          python -m pip install --upgrade pip
          python -m pip install "abicheck==0.3.0"
          clang --version
          castxml --version
          abicheck --version

      - name: Build with Clang and run full abicheck source scan
        id: scan
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python ci/abicheck_realworld_scan.py \
            --target "${{ matrix.target }}" \
            --output-root "$GITHUB_WORKSPACE/abicheck-results"

      - name: Upload complete target evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abicheck-${{ matrix.target }}
          path: abicheck-results/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

  aggregate:
    name: aggregate
    if: always()
    needs: scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout orchestration branch
        uses: actions/checkout@v4
      - name: Expand aggregation script
        shell: bash
        run: |
          set -euxo pipefail
          base64 -d ci/aggregate_abicheck.py.gz.b64 | gzip -dc > ci/aggregate_abicheck.py
          python -m py_compile ci/aggregate_abicheck.py
      - name: Download target artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: abicheck-*
          path: downloaded
      - name: Build combined report and evidence bundle
        run: |
          python ci/aggregate_abicheck.py --input downloaded --output combined
          find combined -type f -print | sort > combined/file_manifest.txt
          sha256sum $(find combined -type f -print | sort) > combined/SHA256SUMS
      - name: Upload combined evidence
        uses: actions/upload-artifact@v4
        with:
          name: abicheck-realworld-combined
          path: combined
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
